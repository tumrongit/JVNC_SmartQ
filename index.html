<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางติดตามสถานะคำร้อง - ศาลเยาวชนและครอบครัวกลาง</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Sarabun', sans-serif; }
    .header-board { background-color: #1e293b; border-bottom: 3px solid #3b82f6; padding: 20px; }
    .table-dark { --bs-table-bg: #1e293b; --bs-table-color: #f8fafc; }
    .badge-status { font-size: 0.95rem; padding: 8px 12px; }
  </style>
</head>
<body>

  <div class="header-board text-center mb-4">
    <h2 class="fw-bold text-warning">🏛️ สถานะคำร้องและการดำเนินงาน</h2>
    <p class="text-light mb-0">ศาลเยาวชนและครอบครัวกลาง (ข้อมูลประจำวันที่: <span id="currentDate"></span>)</p>
  </div>

  <div class="container-fluid px-4">
    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle">
        <thead class="table-secondary text-dark">
          <tr>
            <th scope="col" style="width: 15%;">เวลาเริ่มยื่น</th>
            <th scope="col" style="width: 20%;">ชื่อผู้มาติดต่อ</th>
            <th scope="col" style="width: 20%;">เรื่อง / คำร้อง</th>
            <th scope="col" style="width: 15%;">ส่วนงานที่รับเรื่อง</th>
            <th scope="col" style="width: 15%;">สถานะปัจจุบัน</th>
            <th scope="col" style="width: 15%;">ระยะเวลาที่ใช้ไป</th>
          </tr>
        </thead>
        <tbody id="queueTableBody">
          <tr>
            <td colspan="6" class="text-center py-4 text-muted">กำลังโหลดข้อมูลคิวงาน...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase Web SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TODO: นำค่า Config จาก Firebase Project ของคุณมาวางตรงนี้
    const firebaseConfig = {
      apiKey: "AIzaSyDv1lkIfMQNFDq-WEWHJ-h7KVZSaatXpi0",
      authDomain: "jvnc-smartq.firebaseapp.com",
      projectId: "jvnc-smartq",
      storageBucket: "jvnc-smartq.firebasestorage.app",
      messagingSenderId: "754731006071",
      appId: "1:754731006071:web:493042a8e10e15d405ee72"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // แสดงวันที่ปัจจุบัน
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

    // ดึงข้อมูลแบบ Real-time Specific วันนี้
    const q = query(
      collection(db, "queues"),
      where("date_string", "==", todayStr),
      orderBy("created_at", "desc")
    );

    let queueDataList = [];

    onSnapshot(q, (snapshot) => {
      queueDataList = [];
      snapshot.forEach((doc) => {
        queueDataList.push({ id: doc.id, ...doc.data() });
      });
      renderTable();
    });

    function renderTable() {
      const tbody = document.getElementById('queueTableBody');
      if (queueDataList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">ยังไม่มีรายการคำร้องในวันนี้</td></tr>';
        return;
      }

      tbody.innerHTML = queueDataList.map(item => {
        const timeStr = new Date(item.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        const durationText = calculateDuration(item.created_at, item.completed_at);
        const isDone = item.status === "นำเอกสารเข้าสำนวนแล้ว" || item.status === "คืนเอกสาร";
        
        return `
          <tr>
            <td class="fw-bold text-info">${timeStr} น.</td>
            <td>${item.customer_name}</td>
            <td>${item.subject}</td>
            <td><span class="badge bg-secondary">${item.department}</span></td>
            <td>
              <span class="badge badge-status ${isDone ? 'bg-success' : 'bg-warning text-dark'}">
                ${item.status}
              </span>
              ${item.memo ? `<div class="small text-info mt-1">📌 ${item.memo}</div>` : ''}
            </td>
            <td class="fw-bold ${isDone ? 'text-muted' : 'text-warning'}" id="timer-${item.id}">
              ${durationText}
            </td>
          </tr>
        `;
      }).join('');
    }

    function calculateDuration(createdAt, completedAt) {
      const start = new Date(createdAt);
      const end = completedAt ? new Date(completedAt) : new Date();
      const diffSec = Math.max(0, Math.floor((end - start) / 1000));
      
      const hours = Math.floor(diffSec / 3600);
      const minutes = Math.floor((diffSec % 3600) / 60);
      const seconds = diffSec % 60;
      
      return `${hours > 0 ? hours + ' ชม. ' : ''}${minutes} นาที ${seconds} วิ`;
    }

    // อัปเดตตัวนับเวลาบนหน้าจอทุกๆ 1 วินาที
    setInterval(() => {
      queueDataList.forEach(item => {
        const timerEl = document.getElementById(`timer-${item.id}`);
        if (timerEl && item.status !== "นำเอกสารเข้าสำนวนแล้ว" && item.status !== "คืนเอกสาร") {
          timerEl.innerText = calculateDuration(item.created_at, null);
        }
      });
    }, 1000);
  </script>
</body>
</html>
