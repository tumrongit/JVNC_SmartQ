<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ติดตามสถานะคำร้อง - ศาลเยาวชนและครอบครัวกลาง</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
    }
    .header-board {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 2px solid #3b82f6;
      padding: 20px 15px;
      margin-bottom: 20px;
    }
    .search-box {
      max-width: 500px;
      margin: 0 auto;
    }
    .search-input {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      font-size: 1rem;
      border-radius: 10px;
      padding: 12px 16px;
    }
    .search-input:focus {
      background-color: #1e293b;
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
    }
    .search-input::placeholder {
      color: #94a3b8;
    }
    /* Style สำหรับ Card คิว */
    .queue-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .queue-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.5);
    }
    .badge-status {
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
    .time-badge {
      background-color: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .duration-badge {
      font-size: 0.9rem;
      font-weight: 700;
    }
    .memo-box {
      background-color: rgba(51, 65, 85, 0.5);
      border-left: 3px solid #3b82f6;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- ส่วนหัวแสดงชื่อศาล วันที่ และช่องค้นหา -->
  <div class="header-board text-center">
    <h3 class="fw-bold text-warning mb-1">🏛️ สถานะคำร้องและการดำเนินงาน</h3>
    <p class="text-light opacity-75 mb-3" style="font-size: 0.95rem;">
      ศาลเยาวชนและครอบครัวกลาง (ประจำวันที่: <span id="currentDate">-</span>)
    </p>

    <!-- ช่องค้นหาชื่อผู้มาติดต่อ -->
    <div class="search-box px-2">
      <input type="text" id="searchInput" class="form-control search-input text-center" placeholder="🔍 พิมพ์ชื่อของคุณเพื่อค้นหาคิว...">
    </div>
  </div>

  <!-- ส่วนแสดงการ์ดรายการคิว -->
  <div class="container px-3 pb-5">
    <div id="queueList" class="row g-3">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div>กำลังโหลดข้อมูลสถานะคิว...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDv1lkIfMQNFDq-WEWHJ-h7KVZSaatXpi0",
      authDomain: "jvnc-smartq.firebaseapp.com",
      projectId: "jvnc-smartq",
      storageBucket: "jvnc-smartq.firebasestorage.app",
      messagingSenderId: "754731006071",
      appId: "1:754731006071:web:493042a8e10e15d405ee72"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // หาวันที่ปัจจุบัน (ไทย)
    const d = new Date();
    const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    document.getElementById('currentDate').innerText = d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

    let rawQueueData = [];
    let filterKeyword = "";

    // ฟังการพิมพ์ค้นหา
    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterKeyword = e.target.value.trim().toLowerCase();
      renderQueueCards();
    });

    // ดึงข้อมูล Realtime
    const q = query(
      collection(db, "queues"),
      where("date_string", "==", todayStr),
      orderBy("created_at", "desc")
    );

    onSnapshot(q, (snapshot) => {
      rawQueueData = [];
      snapshot.forEach((doc) => {
        rawQueueData.push({ id: doc.id, ...doc.data() });
      });
      renderQueueCards();
    });

    // ฟังก์ชันคำนวณระยะเวลา
    function calculateDuration(createdAt, completedAt) {
      if (!createdAt) return '-';
      const start = new Date(createdAt);
      const end = completedAt ? new Date(completedAt) : new Date();
      const diffSec = Math.max(0, Math.floor((end - start) / 1000));
      
      const hours = Math.floor(diffSec / 3600);
      const minutes = Math.floor((diffSec % 3600) / 60);
      const seconds = diffSec % 60;
      
      return `${hours > 0 ? hours + ' ชม. ' : ''}${minutes} นาที ${seconds} วิ`;
    }

    // ฟังก์ชันวาด Card รายการ
    function renderQueueCards() {
      const container = document.getElementById('queueList');

      // กรองด้วยชื่อ
      const filteredData = rawQueueData.filter(item => 
        (item.customer_name || '').toLowerCase().includes(filterKeyword)
      );

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5 text-muted">
            <div class="fs-1 mb-2">📋</div>
            <div>${filterKeyword ? 'ไม่พบรายการที่ค้นหา' : 'ยังไม่มีรายการคำร้องในวันนี้'}</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredData.map(item => {
        const timeStr = new Date(item.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        const isDone = item.completed_at !== null && item.completed_at !== undefined;
        const durationText = item.total_duration || calculateDuration(item.created_at, item.completed_at);

        return `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="queue-card p-3 h-100 d-flex flex-column justify-content-between">
              <div>
                <!-- ส่วนแถบบน: เวลา และส่วนงาน -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="time-badge">🕒 ยื่นเมื่อ ${timeStr} น.</span>
                  <span class="badge bg-secondary opacity-75">${item.department}</span>
                </div>

                <!-- ชื่อ และ เรื่อง -->
                <h5 class="fw-bold text-white mb-1">${item.customer_name}</h5>
                <p class="text-info small mb-2">📄 ${item.subject}</p>

                <!-- Memo ถ้ามี -->
                ${item.memo ? `<div class="memo-box text-warning mb-2">📌 ${item.memo}</div>` : ''}
              </div>

              <!-- ส่วนล่าง: สถานะ และ เวลาที่ใช้ไป -->
              <div class="pt-2 border-top border-secondary mt-2 d-flex justify-content-between align-items-center">
                <div>
                  <span class="badge badge-status ${isDone ? 'bg-success text-white' : 'bg-warning text-dark'}">
                    ${item.status}
                  </span>
                </div>
                <div class="text-end">
                  <small class="text-muted d-block" style="font-size: 0.75rem;">ระยะเวลาที่ใช้</small>
                  <span class="duration-badge ${isDone ? 'text-muted' : 'text-warning'}" id="timer-${item.id}">
                    ${durationText}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // อัปเดตตัวเลขเวลาเดินแบบ Realtime (สำหรับคิวที่ยังไม่กดเสร็จสิ้น)
    setInterval(() => {
      rawQueueData.forEach(item => {
        const isDone = item.completed_at !== null && item.completed_at !== undefined;
        if (!isDone) {
          const timerEl = document.getElementById(`timer-${item.id}`);
          if (timerEl) {
            timerEl.innerText = calculateDuration(item.created_at, null);
          }
        }
      });
    }, 1000);
  </script>
</body>
</html>
