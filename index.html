<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ติดตามสถานะคำร้อง - ศาลเยาวชนและครอบครัวกลาง</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
    }
    .header-board {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 2px solid #3b82f6;
      padding: 20px 15px;
      margin-bottom: 20px;
    }
    .search-box {
      max-width: 500px;
      margin: 0 auto;
    }
    .search-input {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      font-size: 1rem;
      border-radius: 10px;
      padding: 12px 16px;
    }
    .search-input:focus {
      background-color: #1e293b;
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
    }
    .search-input::placeholder {
      color: #94a3b8;
    }
    .queue-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .queue-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.5);
    }
    .time-badge {
      background-color: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .memo-box {
      background-color: rgba(51, 65, 85, 0.5);
      border-left: 3px solid #3b82f6;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.88rem;
    }

    /* Styles สำหรับ Progress Tracker สไตล์สถานีรถไฟ */
    .progress-tracker {
      position: relative;
      margin: 25px 0 10px 0;
      padding: 0 5px;
    }
    .tracker-track {
      position: absolute;
      top: 14px;
      left: 10%;
      right: 10%;
      height: 4px;
      background-color: #334155;
      z-index: 1;
    }
    .tracker-fill {
      position: absolute;
      top: 14px;
      left: 10%;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
      z-index: 2;
      transition: width 0.4s ease;
    }
    .tracker-steps {
      position: relative;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 25%;
      text-align: center;
    }
    .step-node {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #1e293b;
      border: 3px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      transition: all 0.3s;
      margin-bottom: 8px;
    }
    .step-item.active .step-node {
      border-color: #3b82f6;
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    }
    .step-item.current .step-node {
      border-color: #10b981;
      background-color: #059669;
      color: #ffffff;
      animation: pulse-node 1.5s infinite;
    }
    .step-item.completed .step-node {
      border-color: #10b981;
      background-color: #10b981;
      color: #ffffff;
    }
    .step-label {
      font-size: 0.72rem;
      color: #64748b;
      line-height: 1.2;
      font-weight: 500;
    }
    .step-item.active .step-label,
    .step-item.completed .step-label {
      color: #cbd5e1;
    }
    .step-item.current .step-label {
      color: #34d399;
      font-weight: 700;
    }

    @keyframes pulse-node {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

  <div class="header-board text-center">
    <h3 class="fw-bold text-warning mb-1">🏛️ สถานะคำร้องและการดำเนินงาน</h3>
    <p class="text-light opacity-75 mb-3" style="font-size: 0.95rem;">
      ศาลเยาวชนและครอบครัวกลาง (ประจำวันที่: <span id="currentDate">-</span>)
    </p>

    <div class="search-box px-2">
      <input type="text" id="searchInput" class="form-control search-input text-center" placeholder="🔍 พิมพ์ชื่อของคุณเพื่อค้นหาคิว...">
    </div>
  </div>

  <div class="container px-3 pb-5">
    <div id="queueList" class="row g-3">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div>กำลังโหลดข้อมูลสถานะคิว...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDv1lkIfMQNFDq-WEWHJ-h7KVZSaatXpi0",
      authDomain: "jvnc-smartq.firebaseapp.com",
      projectId: "jvnc-smartq",
      storageBucket: "jvnc-smartq.firebasestorage.app",
      messagingSenderId: "754731006071",
      appId: "1:754731006071:web:493042a8e10e15d405ee72"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const d = new Date();
    const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    document.getElementById('currentDate').innerText = d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

    let rawQueueData = [];
    let filterKeyword = "";

    // แมปขั้นตอนสถานะกับเปอร์เซ็นต์และลำดับ index
    const statusMap = {
      "เจ้าหน้าที่รับเอกสารเพื่อตรวจสอบ": { step: 1, percent: 25 },
      "ผู้พิพากษาพิจารณาคำร้อง": { step: 2, percent: 50 },
      "ผู้พิพากษามีคำสั่งแล้ว": { step: 3, percent: 75 },
      "เสร็จสิ้น": { step: 4, percent: 100 }
    };

    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterKeyword = e.target.value.trim().toLowerCase();
      renderQueueCards();
    });

    const q = query(
      collection(db, "queues"),
      where("date_string", "==", todayStr),
      orderBy("created_at", "desc")
    );

    onSnapshot(q, (snapshot) => {
      rawQueueData = [];
      snapshot.forEach((doc) => {
        rawQueueData.push({ id: doc.id, ...doc.data() });
      });
      renderQueueCards();
    });

    function renderQueueCards() {
      const container = document.getElementById('queueList');

      const filteredData = rawQueueData.filter(item => 
        (item.customer_name || '').toLowerCase().includes(filterKeyword)
      );

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5 text-muted">
            <div class="fs-1 mb-2">📋</div>
            <div>${filterKeyword ? 'ไม่พบรายการที่ค้นหา' : 'ยังไม่มีรายการคำร้องในวันนี้'}</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredData.map(item => {
        const timeStr = new Date(item.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        
        // หา Progress step
        const currentStatusInfo = statusMap[item.status] || { step: 1, percent: 25 };
        const currentStep = currentStatusInfo.step;
        const progressPercent = currentStatusInfo.percent;
        
        // คำนวณความยาวเส้นหลอด Progress (ช่วงจาก 0% ถึง 80% สำหรับ 4 ขั้น)
        const fillWidthPercent = (currentStep - 1) * 26.66;

        return `
          <div class="col-12 col-md-6 col-lg-6 col-xl-4">
            <div class="queue-card p-3 h-100 d-flex flex-column justify-content-between">
              <div>
                <!-- ส่วนแถบบน: เวลา และ ส่วนงาน -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="time-badge">🕒 ยื่นเมื่อ ${timeStr} น.</span>
                  <div class="d-flex align-items-center gap-1">
                    <span class="badge bg-secondary opacity-75">${item.department}</span>
                    <span class="badge ${currentStep === 4 ? 'bg-success' : 'bg-primary'}">${progressPercent}%</span>
                  </div>
                </div>

                <h5 class="fw-bold text-white mb-1">${item.customer_name}</h5>
                <p class="text-info small mb-2">📄 ${item.subject}</p>

                ${item.memo ? `<div class="memo-box text-warning mb-2">📌 ${item.memo}</div>` : ''}
              </div>

              <!-- Progress Tracker Bar สไตล์สถานีรถไฟ -->
              <div class="progress-tracker">
                <div class="tracker-track"></div>
                <div class="tracker-fill" style="width: ${fillWidthPercent}%;"></div>
                
                <div class="tracker-steps">
                  <!-- สถานีที่ 1 -->
                  <div class="step-item ${currentStep > 1 ? 'completed' : (currentStep === 1 ? 'current' : '')}">
                    <div class="step-node">${currentStep > 1 ? '✓' : '1'}</div>
                    <div class="step-label">เจ้าหน้าที่รับเอกสาร</div>
                  </div>
                  
                  <!-- สถานีที่ 2 -->
                  <div class="step-item ${currentStep > 2 ? 'completed' : (currentStep === 2 ? 'current' : (currentStep > 1 ? 'active' : ''))}">
                    <div class="step-node">${currentStep > 2 ? '✓' : '2'}</div>
                    <div class="step-label">ผู้พิพากษาพิจารณา</div>
                  </div>
                  
                  <!-- สถานีที่ 3 -->
                  <div class="step-item ${currentStep > 3 ? 'completed' : (currentStep === 3 ? 'current' : (currentStep > 2 ? 'active' : ''))}">
                    <div class="step-node">${currentStep > 3 ? '✓' : '3'}</div>
                    <div class="step-label">มีคำสั่งแล้ว</div>
                  </div>
                  
                  <!-- สถานีที่ 4 -->
                  <div class="step-item ${currentStep === 4 ? 'completed current' : ''}">
                    <div class="step-node">${currentStep === 4 ? '✓' : '4'}</div>
                    <div class="step-label">เสร็จสิ้น</div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
