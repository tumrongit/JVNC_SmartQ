<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคิว - เจ้าหน้าที่ศาล</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <h3 class="mb-4 text-primary">🛠️ บันทึกและจัดการสถานะคำร้อง (เจ้าหน้าที่)</h3>

    <!-- ฟอร์มสร้างคิวใหม่ -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white fw-bold">สร้างรายการคำร้องใหม่</div>
      <div class="card-body">
        <form id="addQueueForm" class="row g-3">
          <div class="col-md-4">
            <label class="form-label">1. ชื่อผู้มาติดต่อ</label>
            <input type="text" id="customer_name" class="form-control" required placeholder="เช่น นายสมชาย ใจดี">
          </div>
          <div class="col-md-4">
            <label class="form-label">2. เรื่อง / คำร้อง</label>
            <input type="text" id="subject" class="form-control" required placeholder="เช่น ยื่นคำร้องขอประกันตัว">
          </div>
          <div class="col-md-4">
            <label class="form-label">ส่วนงานที่รับเอกสาร</label>
            <select id="department" class="form-select" required>
              <option value="ส่วนช่วยอำนวยการ">ส่วนช่วยอำนวยการ</option>
              <option value="ส่วนงานประชาสัมพันธ์และบริการประชาชน">ส่วนงานประชาสัมพันธ์และบริการประชาชน</option>
              <option value="ส่วนบริหารจัดการคดี(ชั้น 2)">ส่วนบริหารจัดการคดี(ชั้น 2)</option>
              <option value="ห้องเก็บสำนวน">ห้องเก็บสำนวน</option>
              <option value="ส่วนคลัง">ส่วนคลัง</option>
              <option value="ส่วนไกล่เกลี่ยฯ">ส่วนไกล่เกลี่ยฯ</option>
              <option value="ส่วนมาตรการพิเศษ">ส่วนมาตรการพิเศษ</option>
              <option value="ส่วนช่วยพิจารณาคดี">ส่วนช่วยพิจารณาคดี</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">3. สถานะเริ่มต้น</label>
            <select id="status" class="form-select" required>
              <option value="เจ้าหน้าที่รับเอกสารเพื่อตรวจสอบ">เจ้าหน้าที่รับเอกสารเพื่อตรวจสอบ</option>
              <option value="ผู้พิพากษาพิจารณาคำร้อง">ผู้พิพากษาพิจารณาคำร้อง</option>
              <option value="ผู้พิพากษามีคำสั่งแล้ว">ผู้พิพากษามีคำสั่งแล้ว</option>
              <option value="นำเอกสารเข้าสำนวนแล้ว">นำเอกสารเข้าสำนวนแล้ว</option>
              <option value="คืนเอกสาร">คืนเอกสาร</option>
            </select>
          </div>
          <div class="col-md-8">
            <label class="form-label">4. Memo (แจ้งข้อมูลเพิ่มเติม)</label>
            <input type="text" id="memo" class="form-control" placeholder="ข้อความแจ้งประชาชนเพิ่มเติม (ถ้ามี)">
          </div>
          <div class="col-12 text-end">
            <button type="submit" id="submitBtn" class="btn btn-success px-4">➕ สร้างรายการคิว</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ตารางรายการคิวเพื่ออัปเดต/ลบสถานะ -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">รายการคิวทั้งหมดของวันนี้</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 10%;">เวลา</th>
                <th style="width: 18%;">ชื่อผู้ติดต่อ</th>
                <th style="width: 18%;">เรื่อง</th>
                <th style="width: 14%;">ส่วนงาน</th>
                <th style="width: 18%;">สถานะ / Memo</th>
                <th style="width: 10%;">เวลาที่ใช้</th>
                <th style="width: 12%;" class="text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="adminTableBody">
              <tr><td colspan="7" class="text-center py-4 text-muted">กำลังโหลดข้อมูลคิวงาน...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDv1lkIfMQNFDq-WEWHJ-h7KVZSaatXpi0",
      authDomain: "jvnc-smartq.firebaseapp.com",
      projectId: "jvnc-smartq",
      storageBucket: "jvnc-smartq.firebasestorage.app",
      messagingSenderId: "754731006071",
      appId: "1:754731006071:web:493042a8e10e15d405ee72"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // คำนวณวันที่ตามเวลาประเทศไทย (YYYY-MM-DD)
    const d = new Date();
    const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    // ฟังก์ชันคำนวณข้อความระยะเวลา
    function formatDuration(createdAt, completedAt) {
      if (!createdAt) return '-';
      const start = new Date(createdAt);
      const end = completedAt ? new Date(completedAt) : new Date();
      const diffSec = Math.max(0, Math.floor((end - start) / 1000));
      
      const hours = Math.floor(diffSec / 3600);
      const minutes = Math.floor((diffSec % 3600) / 60);
      const seconds = diffSec % 60;
      
      return `${hours > 0 ? hours + ' ชม. ' : ''}${minutes} นาที ${seconds} วิ`;
    }

    // เพิ่มคิวใหม่
    document.getElementById('addQueueForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      try {
        const createdAt = new Date().toISOString();
        const newQueue = {
          customer_name: document.getElementById('customer_name').value,
          subject: document.getElementById('subject').value,
          department: document.getElementById('department').value,
          status: document.getElementById('status').value,
          memo: document.getElementById('memo').value,
          created_at: createdAt,
          completed_at: null,
          total_duration: null,
          date_string: todayStr
        };

        await addDoc(collection(db, "queues"), newQueue);
        document.getElementById('addQueueForm').reset();
        alert('เพิ่มคิวเรียบร้อยแล้ว!');
      } catch (err) {
        console.error("เกิดข้อผิดพลาดในการบันทึก:", err);
        alert('ไม่สามารถบันทึกข้อมูลได้: ' + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // ดึงข้อมูลคิวมาแสดง Realtime
    const q = query(
      collection(db, "queues"), 
      where("date_string", "==", todayStr), 
      orderBy("created_at", "desc")
    );
    
    onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = '';
      
      if (snapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">ยังไม่มีรายการคำร้องในวันนี้</td></tr>';
        return;
      }

      snapshot.forEach((documentSnap) => {
        const item = documentSnap.data();
        const docId = documentSnap.id;
        const timeStr = new Date(item.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        const isCompleted = item.completed_at !== null && item.completed_at !== undefined;
        const displayDuration = item.total_duration || formatDuration(item.created_at, item.completed_at);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${timeStr} น.</td>
          <td><b>${item.customer_name}</b></td>
          <td>${item.subject}</td>
          <td><small class="badge bg-secondary">${item.department}</small></td>
          <td>
            <select class="form-select form-select-sm mb-1" onchange="updateStatus('${docId}', this.value)">
              <option value="เจ้าหน้าที่รับเอกสารเพื่อตรวจสอบ" ${item.status === 'เจ้าหน้าที่รับเอกสารเพื่อตรวจสอบ' ? 'selected' : ''}>เจ้าหน้าที่รับเอกสารเพื่อตรวจสอบ</option>
              <option value="ผู้พิพากษาพิจารณาคำร้อง" ${item.status === 'ผู้พิพากษาพิจารณาคำร้อง' ? 'selected' : ''}>ผู้พิพากษาพิจารณาคำร้อง</option>
              <option value="ผู้พิพากษามีคำสั่งแล้ว" ${item.status === 'ผู้พิพากษามีคำสั่งแล้ว' ? 'selected' : ''}>ผู้พิพากษามีคำสั่งแล้ว</option>
              <option value="นำเอกสารเข้าสำนวนแล้ว" ${item.status === 'นำเอกสารเข้าสำนวนแล้ว' ? 'selected' : ''}>นำเอกสารเข้าสำนวนแล้ว</option>
              <option value="คืนเอกสาร" ${item.status === 'คืนเอกสาร' ? 'selected' : ''}>คืนเอกสาร</option>
            </select>
            <input type="text" class="form-control form-control-sm" value="${item.memo || ''}" placeholder="แก้ไข Memo" onblur="updateMemo('${docId}', this.value)">
          </td>
          <td>
            <span class="badge ${isCompleted ? 'bg-success' : 'bg-warning text-dark'}">
              ${displayDuration}
            </span>
          </td>
          <td class="text-center">
            ${!isCompleted ? `
              <button class="btn btn-success btn-sm mb-1 w-100" onclick="finishQueue('${docId}', '${item.created_at}')">
                ✅ เสร็จสิ้น
              </button>
            ` : `
              <span class="badge bg-secondary mb-1">ปิดงานแล้ว</span>
            `}
            <button class="btn btn-outline-danger btn-sm w-100" onclick="deleteQueue('${docId}', '${item.customer_name}')">
              🗑️ ลบ
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }, (error) => {
      console.error("Firestore Error:", error);
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">เกิดข้อผิดพลาดในการโหลดข้อมูล (โปรดเช็ก Console/Rules)</td></tr>`;
    });

    // ฟังก์ชันอัปเดตเฉพาะสถานะ
    window.updateStatus = async (docId, newStatus) => {
      const queueRef = doc(db, "queues", docId);
      await updateDoc(queueRef, { status: newStatus });
    };

    // ฟังก์ชันกดปุ่ม "เสร็จสิ้น"
    window.finishQueue = async (docId, createdAt) => {
      if (confirm('คุณต้องการจบการทำงานคิวนี้และบันทึกเวลาใช่หรือไม่?')) {
        const queueRef = doc(db, "queues", docId);
        const completedAt = new Date().toISOString();
        const durationStr = formatDuration(createdAt, completedAt);

        await updateDoc(queueRef, {
          completed_at: completedAt,
          total_duration: durationStr
        });
        alert('บันทึกการจบงานและหยุดเวลาเรียบร้อยแล้ว');
      }
    };

    // ฟังก์ชันอัปเดต Memo
    window.updateMemo = async (docId, newMemo) => {
      const queueRef = doc(db, "queues", docId);
      await updateDoc(queueRef, { memo: newMemo });
    };

    // ฟังก์ชันลบคิวงาน
    window.deleteQueue = async (docId, name) => {
      if (confirm(`คุณต้องการลบรายการคิวของ "${name}" ใช่หรือไม่?`)) {
        await deleteDoc(doc(db, "queues", docId));
        alert('ลบรายการคิวเรียบร้อยแล้ว');
      }
    };
  </script>
</body>
</html>
